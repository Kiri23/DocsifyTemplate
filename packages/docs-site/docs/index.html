<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>docs-site</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app">Cargando…</div>
    <!-- Los docs de este paquete, servidos como los serviría cualquier repo de afuera. -->
    <script>
      window.$docsify = {
        name: "docs-site",
        repo: "https://github.com/Kiri23/DocsifyTemplate",
        // Un componente propio de estos docs, además de los de fábrica: traer-tu-ui.md.
        components: ["propios/retro-semanal.js", "propios/ui-sdk-demos.js"],
        // Del catálogo solo entra el glosario, que tiene su sección en el sidebar de la raíz: el mismo
        // sidebar en todas las páginas, también en _catalogo/.
        alias: { "/.*/_sidebar.md": "/_sidebar.md" },
      };
    </script>
    <script src="../site.js"></script>
  </body>
</html>
